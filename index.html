<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Python Pipeline Explorer</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
<script src="https://cdn.jsdelivr.net/pyodide/v0.29.0/full/pyodide.js"></script>
<style>
:root {
  --bg: #f6f5f1; --panel: #ffffff; --panel-2: #faf9f6; --border: #e2dfd6;
  --text: #1d2026; --muted: #6d7179; --accent: #2f62d0;
  --hl: rgba(255, 190, 0, .38); --hl-line: rgba(255, 190, 0, .16);
  --active: rgba(47, 98, 208, .16); --active-weak: rgba(47, 98, 208, .06);
  --sel: rgba(47, 98, 208, .18);
  --err: #c0262d; --err-bg: #fdecec; --warn: #8a5a00; --warn-bg: #fff6df;
  --c-kw: #8a2be2; --c-soft: #b05fd8; --c-name: #1d2026; --c-op: #b04a00;
  --c-num: #0a7a52; --c-str: #b0122e; --c-struct: #7d8189; --c-comment: #6f7f4a;
  --c-call: #2f62d0; --c-load: #0a7a52; --c-store: #b04a00; --c-jump: #8a2be2; --c-ret: #c0262d;
  --mono: ui-monospace, "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121418; --panel: #1a1d22; --panel-2: #20242a; --border: #2d323a;
    --text: #e4e6ea; --muted: #8b919b; --accent: #7aa2ff;
    --hl: rgba(255, 200, 40, .30); --hl-line: rgba(255, 200, 40, .10);
    --active: rgba(122, 162, 255, .22); --active-weak: rgba(122, 162, 255, .08);
    --sel: rgba(122, 162, 255, .25);
    --err: #ff6b6b; --err-bg: #3a1c1e; --warn: #f0c060; --warn-bg: #3a2f14;
    --c-kw: #c49bff; --c-soft: #d8b8ff; --c-name: #e4e6ea; --c-op: #ffa66b;
    --c-num: #6fd6a8; --c-str: #ff8a9a; --c-struct: #8b919b; --c-comment: #a3b57a;
    --c-call: #7aa2ff; --c-load: #6fd6a8; --c-store: #ffa66b; --c-jump: #c49bff; --c-ret: #ff6b6b;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 13px/1.45 var(--sans); display: flex; flex-direction: column; }
button, select { font: inherit; color: inherit; }

header { display: flex; align-items: center; gap: 14px; padding: 10px 16px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
header h1 { font-size: 15px; margin: 0; font-weight: 650; letter-spacing: -.01em; }
header .pipeline { font-family: var(--mono); color: var(--muted); font-size: 12px; }
header .spacer { flex: 1; }
#status { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
#status.loading::before { content: ""; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--muted); border-top-color: transparent; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

select, .btn { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 3px 8px; cursor: pointer; }
.btn:hover, select:hover { border-color: var(--muted); }
label.chk { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); cursor: pointer; user-select: none; }

#msgbar { padding: 0 16px; }
#msgbar:empty { display: none; }
.msg { margin: 8px 0 0; padding: 6px 10px; border-radius: 6px; font-family: var(--mono); font-size: 12px; }
.msg.err { background: var(--err-bg); color: var(--err); }
.msg.warn { background: var(--warn-bg); color: var(--warn); }

main { flex: 1; min-height: 0; display: grid; gap: 0; padding: 10px 16px 16px;
  grid-template-columns: var(--w1, 34%) 8px var(--w2, 33%) 8px minmax(0, 1fr); }
.gutter { cursor: col-resize; position: relative; }
.gutter::after { content: ""; position: absolute; inset: 0 3px; border-radius: 2px; }
.gutter:hover::after, .gutter.drag::after { background: var(--accent); opacity: .5; }
.pane { min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.pane-head { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-bottom: 1px solid var(--border); background: var(--panel-2); flex-wrap: wrap; min-height: 38px; }
.pane-head .title { font-weight: 600; }
.pane-head .tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-left: auto; font-size: 12px; }
.pane-head .count { color: var(--muted); font-size: 12px; }
.pane-body { flex: 1; min-height: 0; overflow: auto; font-family: var(--mono); font-size: 12.5px; }
.pane-body .empty { padding: 20px; color: var(--muted); font-family: var(--sans); }
#editor { flex: 1; min-height: 0; }

@media (max-width: 860px) {
  main { grid-template-columns: 1fr; grid-auto-rows: minmax(55vh, auto); gap: 10px; }
  .gutter { display: none; }
}

/* CodeMirror theming */
.CodeMirror { height: 100%; background: var(--panel); color: var(--text); font-family: var(--mono); font-size: 13.5px; line-height: 1.55; }
.CodeMirror-gutters { background: var(--panel); border-right: 1px solid var(--border); }
.CodeMirror-linenumber { color: var(--muted); }
.CodeMirror-cursor { border-left-color: var(--text); }
.CodeMirror-selected, .CodeMirror-focused .CodeMirror-selected { background: var(--sel) !important; }
.cm-s-default .cm-keyword { color: var(--c-kw); }
.cm-s-default .cm-number { color: var(--c-num); }
.cm-s-default .cm-string, .cm-s-default .cm-string-2 { color: var(--c-str); }
.cm-s-default .cm-comment { color: var(--c-comment); font-style: italic; }
.cm-s-default .cm-builtin { color: var(--c-call); }
.cm-s-default .cm-def { color: var(--c-call); font-weight: 600; }
.cm-s-default .cm-variable, .cm-s-default .cm-variable-2, .cm-s-default .cm-property { color: var(--text); }
.cm-s-default .cm-operator { color: var(--c-op); }
.cm-s-default .cm-meta { color: var(--c-soft); }
.hl { background: var(--hl); border-radius: 2px; box-shadow: 0 0 0 1px var(--hl); }
.hl-line { background: var(--hl-line); }
.err-mark { text-decoration: wavy underline var(--err); text-decoration-skip-ink: none; background: var(--err-bg); }
.err-line { background: var(--err-bg); }

/* shared item states */
[data-i] { cursor: pointer; }
.active { background: var(--active) !important; }
.active-weak { background: var(--active-weak); }

/* tokens */
table { border-collapse: collapse; width: 100%; }
th { position: sticky; top: 0; background: var(--panel-2); text-align: left; font-family: var(--sans); font-weight: 600; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; padding: 5px 10px; border-bottom: 1px solid var(--border); z-index: 1; }
td { padding: 2px 10px; white-space: nowrap; vertical-align: top; }
tr[data-i]:hover td { background: var(--hl-line); }
tr.line-start td { border-top: 1px solid var(--border); }
td.num { color: var(--muted); text-align: right; }
td.text { white-space: pre; }
td.pos { color: var(--muted); }
.tag { font-weight: 600; }
.tag small { font-weight: 400; color: var(--muted); }
.cat-name .tag { color: var(--c-name); }
.cat-kw .tag { color: var(--c-kw); }
.cat-soft .tag { color: var(--c-soft); }
.cat-op .tag { color: var(--c-op); }
.cat-num .tag { color: var(--c-num); }
.cat-str .tag { color: var(--c-str); }
.cat-struct .tag { color: var(--c-struct); font-style: italic; }
.cat-comment .tag { color: var(--c-comment); }
.cat-err .tag { color: var(--err); }
.hide-trivia tr.cat-trivia { display: none; }
.tok-err { padding: 8px 10px; color: var(--err); }

/* AST */
.ast { padding: 6px 4px 12px; }
.ast details { margin-left: 14px; }
.ast > details { margin-left: 0; }
.ast summary { list-style: none; padding: 1px 6px; border-radius: 4px; white-space: nowrap; }
.ast summary::-webkit-details-marker { display: none; }
.ast summary::before { content: "▸"; display: inline-block; width: 12px; color: var(--muted); transition: transform .1s; }
.ast details[open] > summary::before { transform: rotate(90deg); }
.ast summary[data-i]:hover { background: var(--hl-line); }
.ast .kids { border-left: 1px dashed var(--border); margin-left: 11px; }
.ast .field { margin-left: 14px; padding: 1px 6px 1px 18px; white-space: nowrap; }
.ast .lbl { color: var(--muted); }
.ast .t { color: var(--c-call); font-weight: 650; }
.ast .leaf { color: var(--c-op); }
.ast .pos { color: var(--muted); font-size: 11px; margin-left: 6px; }
.ast .k-str { color: var(--c-str); } .ast .k-num { color: var(--c-num); } .ast .k-const { color: var(--c-kw); }
.hide-pos .ast .pos { display: none; }
.hide-ctx .ast .f-ctx { display: none; }

/* bytecode */
.code-obj { border-bottom: 1px solid var(--border); }
.code-obj h3 { margin: 0; padding: 8px 10px 2px; font-size: 13px; font-family: var(--mono); }
.code-obj h3 span { color: var(--muted); font-weight: 400; font-size: 11.5px; margin-left: 6px; font-family: var(--sans); }
.meta { padding: 2px 10px 8px; color: var(--muted); font-size: 11.5px; display: grid; grid-template-columns: auto 1fr; gap: 0 10px; }
.meta b { font-weight: 500; }
.meta span { color: var(--text); white-space: normal; word-break: break-word; }
.code-obj table th { position: static; }
td.op { font-weight: 600; }
.op-load td.op { color: var(--c-load); } .op-store td.op { color: var(--c-store); }
.op-call td.op { color: var(--c-call); } .op-jump td.op { color: var(--c-jump); }
.op-ret td.op { color: var(--c-ret); }
td.label { color: var(--c-jump); font-weight: 600; }
td.argrepr { color: var(--muted); white-space: pre; }
tr.no-range td { opacity: .65; }
</style>
</head>
<body>
<header>
  <h1>Python Pipeline Explorer</h1>
  <span class="pipeline">source → tokenize → ast → compile/dis</span>
  <span class="spacer"></span>
  <label class="chk">Example
    <select id="examples"><option value="">—</option></select>
  </label>
  <span id="status" class="loading">Loading CPython (Pyodide)…</span>
</header>
<div id="msgbar"></div>
<main id="main">
  <section class="pane">
    <div class="pane-head"><span class="title">Source</span>
      <span class="tools"><span class="count">hover any item on the right to see its source range</span></span></div>
    <div id="editor"></div>
  </section>
  <div class="gutter" data-g="1"></div>
  <section class="pane" id="paneA"></section>
  <div class="gutter" data-g="2"></div>
  <section class="pane" id="paneB"></section>
</main>

<script>
const PYODIDE_VERSION = "0.29.0";
const VIEWS = { tokens: "Tokens", ast: "AST", bytecode: "Bytecode" };

const EXAMPLES = {
  "Expression": "x = 1 + 2 * (3 - y)\n",
  "if / while": "n = 10\nwhile n > 0:\n    if n % 2 == 0:\n        print(n, \"even\")\n    else:\n        print(n)\n    n -= 1\n",
  "Function + closure": "def make_counter(start=0):\n    count = start\n\n    def inc(step=1):\n        nonlocal count\n        count += step\n        return count\n\n    return inc\n\nc = make_counter()\nc()\n",
  "Class": "class Point:\n    \"\"\"A 2D point.\"\"\"\n\n    def __init__(self, x, y):\n        self.x = x\n        self.y = y\n\n    def __add__(self, other):\n        return Point(self.x + other.x, self.y + other.y)\n",
  "Comprehensions": "squares = [x * x for x in range(10) if x % 2]\nlookup = {k: v for k, v in zip(\"abc\", squares)}\ntotal = sum(x for x in squares)\n",
  "f-string": "name = \"world\"\nwidth = 12\nmsg = f\"hello {name!r:>{width}} = {1 + 1}\"\n",
  "match / case": "def describe(cmd):\n    match cmd.split():\n        case [\"go\", direction]:\n            return f\"going {direction}\"\n        case [\"quit\" | \"exit\"]:\n            return \"bye\"\n        case _:\n            return \"unknown\"\n",
  "try / with": "try:\n    with open(\"data.txt\") as f:\n        data = f.read()\nexcept FileNotFoundError as e:\n    data = None\nfinally:\n    print(\"done\")\n",
  "Syntax error": "def f(x:\n    return x\n",
};

// ---------- small helpers ----------
const store = {
  get(k, d) { try { const v = localStorage.getItem("pyx:" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("pyx:" + k, JSON.stringify(v)); } catch {} },
};
function h(tag, props = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k.startsWith("data-")) e.setAttribute(k, v);
    else e[k] = v;
  }
  for (const k of kids.flat()) if (k != null && k !== false) e.append(k instanceof Node ? k : String(k));
  return e;
}
const fmtPos = r => r ? (r[1] == null ? `L${r[0]}` : `${r[0]}:${r[1]}–${r[2]}:${r[3]}`) : "";
const showText = s => JSON.stringify(s);

// ---------- editor ----------
const cm = CodeMirror(document.getElementById("editor"), {
  value: store.get("src", EXAMPLES["Function + closure"]),
  mode: { name: "python", version: 3 },
  lineNumbers: true, indentUnit: 4, tabSize: 4, indentWithTabs: false,
  extraKeys: {
    Tab: c => c.somethingSelected() ? c.indentSelection("add") : c.replaceSelection("    ", "end"),
    "Shift-Tab": c => c.indentSelection("subtract"),
  },
});

let hlMarks = [], errMarks = [];
function markRange(r, cls, lineCls, bucket) {
  if (!r) return;
  const [sl, sc, el, ec] = r;
  const last = cm.lineCount();
  if (sc == null || ec == null || (sl === el && sc === ec)) {
    for (let l = sl; l <= el && l <= last; l++) {
      const handle = cm.addLineClass(l - 1, "background", lineCls);
      bucket.push({ clear: () => cm.removeLineClass(handle, "background", lineCls) });
    }
  } else {
    bucket.push(cm.markText({ line: sl - 1, ch: sc }, { line: el - 1, ch: ec }, { className: cls }));
  }
}
function highlight(r) {
  clearHighlight();
  if (!r) return;
  markRange(r, "hl", "hl-line", hlMarks);
  cm.scrollIntoView({ line: r[0] - 1, ch: r[1] ?? 0 }, 40);
}
function clearHighlight() { hlMarks.forEach(m => m.clear()); hlMarks = []; }

// ---------- panes ----------
const state = { result: null };

function makePane(id, defaultView) {
  const root = document.getElementById(id);
  const pane = { id, root, view: store.get("view:" + id, defaultView), items: [] };
  pane.select = h("select", {}, Object.entries(VIEWS).map(([k, v]) => h("option", { value: k }, v)));
  pane.select.value = pane.view;
  pane.tools = h("span", { class: "tools" });
  pane.body = h("div", { class: "pane-body" });
  root.append(h("div", { class: "pane-head" }, pane.select, pane.tools), pane.body);

  pane.select.addEventListener("change", () => {
    pane.view = pane.select.value; store.set("view:" + id, pane.view); render(pane); syncFromCursor(false);
  });
  pane.body.addEventListener("mouseover", e => {
    const el = e.target.closest("[data-i]");
    if (el && pane.body.contains(el)) highlight(pane.items[+el.dataset.i]?.range);
  });
  pane.body.addEventListener("mouseleave", clearHighlight);
  pane.body.addEventListener("click", e => {
    if (e.target.closest("button, input, label")) return;
    const el = e.target.closest("[data-i]");
    const r = el && pane.items[+el.dataset.i]?.range;
    if (!r) return;
    if (r[1] == null) cm.setSelection({ line: r[0] - 1, ch: 0 }, { line: r[2] - 1, ch: cm.getLine(r[2] - 1)?.length ?? 0 });
    else cm.setSelection({ line: r[0] - 1, ch: r[1] }, { line: r[2] - 1, ch: r[3] });
  });
  return pane;
}

function addItem(pane, el, range) {
  el.dataset.i = pane.items.length;
  pane.items.push({ el, range });
  return el;
}

// Checkbox that toggles a class on `target`; with `invert`, checked means the class is off.
function toggle(label, cls, target, invert = false) {
  const key = "opt:" + cls;
  const on = store.get(key, false);
  target.classList.toggle(cls, on);
  const input = h("input", { type: "checkbox", checked: invert ? !on : on });
  input.addEventListener("change", () => {
    const v = invert ? !input.checked : input.checked;
    target.classList.toggle(cls, v); store.set(key, v);
  });
  return h("label", { class: "chk" }, input, label);
}

function render(pane) {
  pane.items = [];
  pane.body.replaceChildren();
  pane.tools.replaceChildren();
  pane.body.className = "pane-body";
  const r = state.result;
  if (!r) { pane.body.append(h("div", { class: "empty" }, "Waiting for Python…")); return; }
  ({ tokens: renderTokens, ast: renderAst, bytecode: renderBytecode })[pane.view](pane, r);
}

// ---- tokens ----
const STRUCT = new Set(["NEWLINE", "NL", "INDENT", "DEDENT", "ENDMARKER"]);
function tokenCat(t) {
  if (t.kw) return t.kw;
  if (t.type === "NAME") return "name";
  if (t.type === "OP") return "op";
  if (t.type === "NUMBER") return "num";
  if (t.type === "STRING" || t.type.startsWith("FSTRING") || t.type.startsWith("TSTRING")) return "str";
  if (t.type === "COMMENT") return "comment";
  if (STRUCT.has(t.type)) return "struct";
  if (t.type === "ERRORTOKEN") return "err";
  return "name";
}
function renderTokens(pane, r) {
  pane.tools.append(
    h("span", { class: "count" }, `${r.tokens.length} tokens`),
    toggle("hide NL / COMMENT", "hide-trivia", pane.body),
  );
  const tbody = h("tbody");
  let prevLine = 0;
  r.tokens.forEach((t, i) => {
    const cat = tokenCat(t);
    const trivia = t.type === "NL" || t.type === "COMMENT";
    const tag = t.type === "OP" ? h("span", { class: "tag" }, "OP ", h("small", {}, t.exact))
      : h("span", { class: "tag" }, t.type, t.kw ? h("small", {}, t.kw === "kw" ? " keyword" : " soft kw") : null);
    const tr = h("tr", { class: `cat-${cat}${trivia ? " cat-trivia" : ""}${t.range[0] !== prevLine && i ? " line-start" : ""}` },
      h("td", { class: "num" }, i), h("td", {}, tag), h("td", { class: "text" }, showText(t.text)),
      h("td", { class: "pos" }, `${t.range[0]}:${t.range[1]}`), h("td", { class: "pos" }, `${t.range[2]}:${t.range[3]}`));
    prevLine = t.range[0];
    addItem(pane, tr, t.range);
    tbody.append(tr);
  });
  pane.body.append(h("table", {},
    h("thead", {}, h("tr", {}, ["#", "type", "text", "start", "end"].map(s => h("th", {}, s)))), tbody));
  if (r.tokenError) pane.body.append(h("div", { class: "tok-err" }, `tokenize stopped: ${r.tokenError}`));
}

// ---- AST ----
function renderAst(pane, r) {
  if (!r.ast) { pane.body.append(h("div", { class: "empty" }, "No AST: the source doesn't parse. The token stream may still be partly available.")); return; }
  const all = open => () => pane.body.querySelectorAll("details").forEach(d => d.open = open);
  pane.tools.append(
    h("button", { class: "btn", onclick: all(true) }, "expand all"),
    h("button", { class: "btn", onclick: all(false) }, "collapse all"),
    toggle("positions", "hide-pos", pane.body, true),
    toggle("hide ctx", "hide-ctx", pane.body),
  );

  const lbl = l => l == null ? null : h("span", { class: "lbl" }, `${l}: `);
  function node(n, label, fieldName) {
    const fcls = fieldName ? ` f-${fieldName}` : "";
    if (n.v !== undefined)
      return h("div", { class: "field" + fcls }, lbl(label), h("span", { class: "k-" + n.k }, n.v));
    if (n.list) {
      if (!n.list.length) return h("div", { class: "field" + fcls }, lbl(label), h("span", { class: "lbl" }, "[]"));
      return h("details", { open: true, class: fcls.trim() || null },
        h("summary", {}, lbl(label), h("span", { class: "lbl" }, `[${n.list.length}]`)),
        h("div", { class: "kids" }, n.list.map((c, i) => node(c, i))));
    }
    if (!n.f.length && !n.range)  // Load, Store, Add, …
      return h("div", { class: "field" + fcls }, lbl(label), h("span", { class: "leaf" }, n.t));
    const summary = h("summary", {}, lbl(label), h("span", { class: "t" }, n.t), n.range ? h("span", { class: "pos" }, fmtPos(n.range)) : null);
    if (n.range) addItem(pane, summary, n.range);
    return h("details", { open: true, class: fcls.trim() || null }, summary,
      h("div", { class: "kids" }, n.f.map(([name, v]) => node(v, name, name))));
  }
  pane.body.append(h("div", { class: "ast" }, node(r.ast)));
}

// ---- bytecode ----
function opFamily(op) {
  if (op.startsWith("LOAD_") || op === "PUSH_NULL" || op === "COPY") return "load";
  if (op.startsWith("STORE_") || op.startsWith("DELETE_")) return "store";
  if (op.startsWith("CALL")) return "call";
  if (op.includes("JUMP") || op === "FOR_ITER" || op === "SEND" || op === "END_FOR") return "jump";
  if (op.startsWith("RETURN") || op.startsWith("RAISE") || op === "RERAISE" || op.startsWith("YIELD")) return "ret";
  return "";
}
function renderBytecode(pane, r) {
  if (!r.bytecode) { pane.body.append(h("div", { class: "empty" }, "No bytecode: the source doesn't compile.")); return; }
  const n = r.bytecode.reduce((s, c) => s + c.instrs.length, 0);
  pane.tools.append(h("span", { class: "count" }, `${n} instructions · ${r.bytecode.length} code object${r.bytecode.length > 1 ? "s" : ""}`));
  for (const co of r.bytecode) {
    const meta = h("div", { class: "meta" });
    const row = (k, v) => v.length && meta.append(h("b", {}, k), h("span", {}, v.join(", ")));
    if (co.name !== "<module>") meta.append(h("b", {}, "argcount"), h("span", {}, co.argcount));
    row("locals", co.varnames); row("cells", co.cellvars); row("free", co.freevars);
    row("names", co.names); row("consts", co.consts);
    const tbody = h("tbody");
    let prevLine = null;
    for (const ins of co.instrs) {
      const tr = h("tr", { class: `op-${opFamily(ins.op)}${ins.range ? "" : " no-range"}${ins.line !== prevLine && prevLine !== null ? " line-start" : ""}` },
        h("td", { class: "num" }, ins.line !== prevLine && ins.line > 0 ? ins.line : ""),
        h("td", { class: "label" }, ins.label != null ? `L${ins.label}:` : ""),
        h("td", { class: "num" }, ins.offset),
        h("td", { class: "op" }, ins.op),
        h("td", { class: "num" }, ins.arg ?? ""),
        h("td", { class: "argrepr" }, ins.argrepr ? `(${ins.argrepr})` : ""));
      prevLine = ins.line;
      addItem(pane, tr, ins.range);
      tbody.append(tr);
    }
    pane.body.append(h("section", { class: "code-obj" },
      h("h3", {}, co.name, h("span", {}, `line ${co.firstline}`)), meta,
      h("table", {}, h("thead", {}, h("tr", {}, ["line", "", "offset", "opname", "arg", ""].map(s => h("th", {}, s)))), tbody)));
  }
}

// ---------- cursor → panes ----------
function contains(r, line, ch, strict) {
  if (!r) return false;
  const [sl, sc, el, ec] = r;
  if (line < sl || line > el) return false;
  if (sc == null) return true;
  if (line === sl && ch < sc) return false;
  if (line === el && (strict ? ch >= ec : ch > ec)) return false;
  return true;
}
const size = r => r[1] == null ? (r[2] - r[0] + 1) * 1e6 : (r[2] - r[0]) * 1e4 + (r[3] - r[1]);
function syncFromCursor(scroll = true) {
  const p = cm.getCursor(), line = p.line + 1, ch = p.ch;
  for (const pane of panes) {
    pane.body.querySelectorAll(".active, .active-weak").forEach(e => e.classList.remove("active", "active-weak"));
    let hits = pane.items.filter(it => contains(it.range, line, ch, true) && size(it.range) > 0);
    if (!hits.length) hits = pane.items.filter(it => contains(it.range, line, ch, false));
    if (!hits.length) continue;
    const min = Math.min(...hits.map(it => size(it.range)));
    let first = null;
    for (const it of hits) {
      const strong = size(it.range) === min;
      it.el.classList.add(strong ? "active" : "active-weak");
      if (strong && !first) first = it.el;
    }
    if (scroll && first) {
      for (let d = first.parentElement; d && d !== pane.body; d = d.parentElement) if (d.tagName === "DETAILS") d.open = true;
      first.scrollIntoView({ block: "nearest" });
    }
  }
}
cm.on("cursorActivity", () => syncFromCursor(true));

// ---------- analysis ----------
const msgbar = document.getElementById("msgbar");
let analyzeFn = null, timer = null;

function runAnalysis() {
  if (!analyzeFn) return;
  const src = cm.getValue();
  store.set("src", src);
  let r;
  try { r = JSON.parse(analyzeFn(src)); }
  catch (e) { r = { tokens: [], warnings: [], error: { kind: "InternalError", msg: String(e), range: null } }; }
  state.result = r;

  errMarks.forEach(m => m.clear()); errMarks = [];
  msgbar.replaceChildren();
  if (r.error) {
    const where = r.error.range ? ` (line ${r.error.range[0]}, col ${r.error.range[1] + 1})` : "";
    msgbar.append(h("div", { class: "msg err" }, `${r.error.kind}: ${r.error.msg}${where}`));
    if (r.error.range) {
      markRange(r.error.range, "err-mark", "err-line", errMarks);
      markRange([r.error.range[0], null, r.error.range[0], null], "", "err-line", errMarks);
    }
  }
  for (const w of r.warnings || []) msgbar.append(h("div", { class: "msg warn" }, `warning · ${w}`));
  panes.forEach(render);
  syncFromCursor(false);
}
cm.on("changes", () => { clearTimeout(timer); timer = setTimeout(runAnalysis, 300); });

// ---------- examples ----------
const exSel = document.getElementById("examples");
for (const name of Object.keys(EXAMPLES)) exSel.append(h("option", { value: name }, name));
exSel.addEventListener("change", () => {
  if (!exSel.value) return;
  cm.setValue(EXAMPLES[exSel.value]); cm.focus(); exSel.value = "";
});

// ---------- resizable columns ----------
const main = document.getElementById("main");
let widths = store.get("widths", [34, 33]);
const applyWidths = () => { main.style.setProperty("--w1", widths[0] + "%"); main.style.setProperty("--w2", widths[1] + "%"); };
applyWidths();
main.querySelectorAll(".gutter").forEach(g => {
  g.addEventListener("pointerdown", e => {
    e.preventDefault(); g.setPointerCapture(e.pointerId); g.classList.add("drag");
    const rect = main.getBoundingClientRect();
    const move = ev => {
      const pct = (ev.clientX - rect.left) / rect.width * 100, MIN = 15;
      if (g.dataset.g === "1") {
        const total = widths[0] + widths[1];
        widths[0] = Math.max(MIN, Math.min(total - MIN, pct)); widths[1] = total - widths[0];
      } else {
        widths[1] = Math.max(MIN, Math.min(100 - widths[0] - MIN, pct - widths[0]));
      }
      applyWidths(); cm.refresh();
    };
    const up = () => { g.removeEventListener("pointermove", move); g.classList.remove("drag"); store.set("widths", widths); };
    g.addEventListener("pointermove", move);
    g.addEventListener("pointerup", up, { once: true });
  });
});

// ---------- boot ----------
const panes = [makePane("paneA", "tokens"), makePane("paneB", "ast")];
panes.forEach(render);

(async () => {
  const status = document.getElementById("status");
  try {
    const py = await loadPyodide({ indexURL: `https://cdn.jsdelivr.net/pyodide/v${PYODIDE_VERSION}/full/` });
    const code = await (await fetch("analyze.py", { cache: "no-cache" })).text();
    py.runPython(code);
    analyzeFn = py.globals.get("analyze");
    status.className = "";
    status.textContent = `CPython ${py.runPython("VERSION")} · Pyodide ${PYODIDE_VERSION}`;
    runAnalysis();
  } catch (e) {
    status.className = "";
    status.textContent = "Failed to load Python";
    msgbar.replaceChildren(h("div", { class: "msg err" }, `Could not start Pyodide: ${e}. Serve this folder over HTTP (python3 -m http.server) and check your connection.`));
  }
})();
</script>
</body>
</html>
